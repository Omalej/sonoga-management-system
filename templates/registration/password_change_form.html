{% extends "layouts/base.html" %}
{% block title %}Change Password | Sonoga HMS{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Change Password</h1>
  <p class="muted">For security, replace your temporary password before continuing.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
