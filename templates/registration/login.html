{% load static %}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonoga Login</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">SONOGA <span>GROUP</span></div>
    <p>Management System</p>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}<div class="field-row"><label>{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>{% endfor %}
      <button class="btn primary full" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
